<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device, initial-scale=1" />
    <title>OpenCode — Agents Dashboard</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9" />
          </svg>
        </span>
        <span>Agents Dashboard</span>
      </div>
      <div class="topstats" id="topstats"></div>
      <div class="spacer"></div>
      <button class="topbtn" id="follow-chip" title="Auto-switch to whichever session is active">Following ●</button>
      <button class="topbtn" id="stop-btn" title="Stop observing (the plugin keeps running)">⏻ Stop</button>
      <span class="live offline" id="live"><span class="dot"></span><span id="live-text">OFFLINE</span></span>
    </header>

    <div class="app">
      <aside class="side" id="side">
        <div class="side-cap">SESSIONS <span id="side-count"></span></div>
        <div class="side-list" id="side-list"></div>
      </aside>
      <main class="stage" id="stage"></main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
